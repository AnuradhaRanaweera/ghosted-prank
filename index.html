<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>👻 You've Been Ghosted</title>
<style>
  :root{
    --bg:#0b0f14; --bg2:#121923; --text:#e8f1ff; --accent:#7df9ff; --muted:#8aa0b8;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef4fb; --bg2:#ffffff; --text:#0b0f14; --accent:#0077aa; --muted:#4a5a6a; }
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg));
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  .card{
    text-align:center;
    padding: 40px 32px;
    max-width: 480px;
  }
  .ghost{
    font-size: 6rem;
    animation: float 3s ease-in-out infinite;
    display:inline-block;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotate(-3deg); }
    50%{ transform: translateY(-20px) rotate(3deg); }
  }
  h1{
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    margin: 20px 0 10px;
    letter-spacing: -0.02em;
  }
  .glitch{
    color: var(--accent);
  }
  p{
    color: var(--muted);
    font-size: 1.05rem;
    line-height: 1.5;
  }
  .blink{
    animation: blink 1.2s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }
  .tiny{
    margin-top: 28px;
    font-size: 0.8rem;
    color: var(--muted);
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ghost">👻</div>
    <h1>You've been <span class="glitch">GHOSTED</span><span class="blink">_</span></h1>
    <p>Just kidding — nothing here is real. No data, no tracking, no hacking. Just a ghost saying boo.</p>
    <div class="tiny">(this is a harmless joke page, not an actual hack)</div>
  </div>
</body>
</html>
